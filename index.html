<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I LOVE YOU</title>
<script>
/* 分享链接（?s= / ?t= / #z…）先给 <html> 打上 viewer 标记，按钮从第一帧起就是隐藏的 */
(function(){var q=location.search,h=location.hash;if(/[?&](s|t)=/.test(q)||/^#[zp][A-Za-z0-9_-]{8,}/.test(h))document.documentElement.classList.add("viewer");})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="stage" aria-live="polite"></div>
<p class="hint" id="hint">点窗口置顶，拖标题栏移动，点红点关闭</p>
<div class="fabs">
  <button class="fab" id="btnShare" type="button">分享</button>
  <button class="fab" id="btnEdit" type="button">修改</button>
  <button class="fab" id="btnMore" type="button">更多</button>
  <button class="fab" id="btnSound" type="button" aria-pressed="false">音乐</button>
  <button class="fab" id="btnReplay" type="button">重播</button>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheetEdit" hidden aria-label="修改弹窗内容">
  <div class="sheet-in">
    <h2>修改弹窗内容</h2>
    <div class="row">
      <div class="field">
        <label for="fTitle">窗口标题</label>
        <input id="fTitle" type="text" maxlength="20">
      </div>
      <div class="field" style="flex: 0 1 110px">
        <label for="fIcon">标题小图标</label>
        <input id="fIcon" type="text" maxlength="4">
      </div>
    </div>
    <div class="field">
      <label for="fMsgs">弹窗文字（一行一个窗口，最多 40 个）</label>
      <textarea id="fMsgs"></textarea>
    </div>
    <div class="mediabox">
      <div class="lbl">图片和语音窗口（可选，最多 8 个）</div>
      <div class="mhead">
        <button class="mbtn" id="btnAddImg" type="button">添加图片</button>
        <button class="mbtn" id="btnRec" type="button">录一段语音</button>
        <button class="mbtn" id="btnAddAud" type="button">上传音频</button>
      </div>
      <input id="fImg" type="file" accept="image/*" multiple hidden>
      <input id="fAud" type="file" accept="audio/*" hidden>
      <div class="mlist" id="mediaList"></div>
      <label class="check"><input id="fAutoVoice" type="checkbox"> 语音窗口弹出时自动播放</label>
      <div class="field"><label for="fPhoto">图片样式</label>
        <select id="fPhoto"><option value="window">普通窗口</option><option value="polaroid">拍立得（白边 + 手写字）</option><option value="film">胶片（底片边框）</option><option value="mix">拍立得和胶片交替</option></select></div>
      <p class="small">图片会压缩并去掉拍摄位置等信息。点「分享」时它们才会上传到云端，拿到链接的人都能看到。</p>
    </div>
    <div class="mediabox">
      <div class="lbl">背景音乐（可选，不上传就用内置音乐）</div>
      <div class="mhead">
        <button class="mbtn" id="btnAddBgm" type="button">上传一首歌</button>
        <button class="mbtn" id="btnBgmPrev" type="button" aria-label="试听" hidden>▶</button>
        <button class="mbtn" id="btnBgmDel" type="button" hidden>改用内置音乐</button>
      </div>
      <input id="fBgm" type="file" accept="audio/*" hidden>
      <p class="small" id="bgmNote"></p>
    </div>
    <div>
      <div class="lbl" style="margin-bottom: 8px">配色</div>
      <div class="chips" id="skinChips"></div>
    </div>
    <div class="field">
      <label for="fLayout">弹窗排布</label>
      <select id="fLayout">
        <option value="auto">自动（表白模板用爱心）</option>
        <option value="heart">爱心形状（至少 4 条文字）</option>
        <option value="scatter">随机散落</option>
      </select>
    </div>
    <div class="field">
      <label for="fGap">弹出速度：每个间隔 <span id="gapVal"></span> 秒</label>
      <input id="fGap" type="range" min="100" max="1500" step="50">
    </div>
    <div class="row"><div class="field"><label for="fTo">收件人（信封上写“给 ××”）</label><input id="fTo" type="text" maxlength="12"></div><div class="field"><label for="fFrom">落款（信封和结尾署名）</label><input id="fFrom" type="text" maxlength="12"></div></div>
    <label class="check"><input id="fEnv" type="checkbox"> 信封开场（点开才播放弹窗）</label>
    <label class="check"><input id="fFin" type="checkbox"> 最后一句做成压轴窗口（表白模板带「愿意 / 再想想」）</label>
    <label class="check"><input id="fPuzzle" type="checkbox"> 拼图告白：压轴那句话拆成碎片，藏在照片后面，拖到一起才能拼完整（需要已开压轴窗口，建议配 3 张以上照片）</label>
    <label class="check"><input id="fCats" type="checkbox"> 小猫（送信、陪伴、看烟花）：小猫叼着信把窗口送来；屏幕角落有只会犯困、会炸毛、会生气的猫</label>
    <label class="check"><input id="fKnock" type="checkbox"> 小猫打翻东西：小猫跳上桌子，把窗口一个个推下去，窗口带着重量摔在地上（会咚的一声、震一下；开了会替代“叼信送来”）</label>
    <label class="check"><input id="fWand" type="checkbox"> 逗猫棒小游戏：压轴前手指变逗猫棒，逗到小猫 4 次才送来礼物盒（可跳过）</label>
    <label class="check"><input id="fBox" type="checkbox"> 猜纸箱小游戏：小猫藏进三个会换位的纸箱之一，猜对了才送来礼物盒（可跳过）</label>
    <label class="check"><input id="fCatVoice" type="checkbox"> 小猫配音：用真猫的叫声，送信、睡醒、炸毛、生气、高兴时发出不同的“喵”（需开着音乐开关）</label>
    <label class="check"><input id="fFw" type="checkbox"> 压轴烟花：点「愿意」后窗口炸成烟花，聚成那句话和一颗心（点屏幕可跳过）</label>
    <label class="check"><input id="fSelfie" type="checkbox"> 拍立得合影：点「愿意」后，小猫和相框一起出现，自动拍一张「你们的小猫合影」，可以保存成图片（需开着小猫和压轴窗口）</label>
    <label class="check"><input id="fCake" type="checkbox"> 爱心蛋糕：放烟花前小猫把蛋糕推下桌，蜡烛亮起，吹一口气（麦克风）或点一下屏幕才开始放烟花（需开着小猫和压轴窗口）</label>
    <div class="mediabox">
      <div class="lbl">你们的小猫</div>
      <div class="field"><label for="fCatName">名字（信封和窗口标题上会用到）</label><input id="fCatName" type="text" maxlength="8" placeholder="比如：团子"></div>
      <div class="field"><label for="fCatFur">毛色</label><select id="fCatFur"><option value="theme">跟随主题</option><option value="cream">奶油色</option><option value="orange">橘猫</option><option value="gray">灰猫</option><option value="black">黑猫</option><option value="white">白猫</option></select></div>
      <div class="field"><label for="fCatPat">花纹</label><select id="fCatPat"><option value="none">没有</option><option value="spots">花斑</option><option value="tabby">虎纹</option><option value="socks">白袜子</option></select></div>
      <div class="field"><label for="fCatEye">眼睛</label><select id="fCatEye"><option value="dark">黑色</option><option value="green">绿色</option><option value="blue">蓝色</option><option value="gold">金色</option></select></div>
      <div class="field"><label for="fCatBow">领结</label><select id="fCatBow"><option value="none">没有</option><option value="red">红色</option><option value="blue">蓝色</option><option value="yellow">黄色</option><option value="pink">粉色</option></select></div>
      <div id="catPrev" style="padding:10px 0 4px 6px"></div>
    </div>
    <label class="check"><input id="fFx" type="checkbox"> 飘落特效</label>
    <label class="check"><input id="fPets" type="checkbox"> 显示像素小猫和装饰</label>
    <p class="small mode" id="modeNote"></p>
    <div class="actions">
      <button class="btn primary" id="btnSave" type="button">保存并播放</button>
      <button class="btn" id="btnReset" type="button">恢复默认文字</button>
      <button class="btn" id="btnClose" type="button">取消</button>
    </div>
  </div>
</section>

<section class="sheet" id="sheetMore" hidden aria-label="主题模板">
  <div class="sheet-in">
    <h2>主题模板</h2>
    <p class="small">点一个模板，会换上它的配色和整套文字（原来的文字会被替换，选完可以点「撤销」）。</p>
    <div class="tgrid" id="tgrid"></div>
    <div class="actions"><button class="btn" id="btnMoreClose" type="button">关闭</button></div>
  </div>
</section>


<section class="sheet" id="sheetShare" hidden aria-label="分享给 TA">
  <div class="sheet-in">
    <h2>分享给 TA</h2>
    <p class="small">对方打开链接后直接进入你选的模板，页面上没有任何按钮。勾选信封开场时，先看到信封，点开后弹窗才一个个弹出来。</p>
    <div class="row">
      <div class="field"><label for="sTo">收件人名字</label><input id="sTo" type="text" maxlength="12" placeholder="比如：小明"></div>
      <div class="field"><label for="sFrom">落款（你的名字）</label><input id="sFrom" type="text" maxlength="12" placeholder="比如：小红"></div>
    </div>
    <label class="check"><input id="sEnv" type="checkbox" checked> 信封开场（点开才播放，同时开启音乐）</label>
    <div class="qrbox"><img id="qrImg" alt="分享二维码" hidden><p class="small" id="qrNote"></p></div>
    <div class="field"><label for="sLink">专属链接</label><input id="sLink" type="text" readonly></div>
    <div class="actions">
      <button class="btn primary" id="btnCopy" type="button">复制链接</button>
      <button class="btn" id="btnNative" type="button" hidden>发给朋友</button>
      <button class="btn" id="btnShClose" type="button">关闭</button>
    </div>
    <p class="small">内容保存在云端，链接很短；改了文字、名字后会自动生成新的链接。</p>
  </div>
</section>

<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastUndo">撤销</button></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';document.head.appendChild(s)"></script>
<script src="api.js"></script>
<script src="meows.js"></script>
<script src="app.js"></script>
</body>
</html>
